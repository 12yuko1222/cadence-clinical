name: Parent Epic & Execution Graph
description: Create a top-level Parent Epic tracking child task execution order, dependencies, and architecture.
title: "EPIC: "
labels: ["Parent", "enhancement", "architecture"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to scope top-level parent epics and establish execution order across child tasks.

  - type: input
    id: milestone_name
    attributes:
      label: Target Release Milestone
      description: Milestone for this epic (e.g. "Document Management & Archiving").
    validations:
      required: true

  - type: input
    id: requirement_id
    attributes:
      label: Governing Requirement Identifier (PRD / SRS / ADR)
      placeholder: "e.g. PRD-SYS-001, ADR-049"
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Context & Objective
      description: Summary of feature epic, regulatory goals, and system impact.
    validations:
      required: true

  - type: textarea
    id: child_issues
    attributes:
      label: Child Task Breakdown
      description: List child issue numbers using native GitHub tasklist format (`- [ ] #123`).
      value: |
        - [ ] #123 — Core model & migration
        - [ ] #124 — API endpoints
        - [ ] #125 — Frontend SPA integration
    validations:
      required: true

  - type: checkboxes
    id: definition_of_done
    attributes:
      label: Epic Completion Criteria
      options:
        - label: "All child tasks complete and verified."
          required: true
        - label: "End-to-end integration and GxP compliance validated."
          required: true
