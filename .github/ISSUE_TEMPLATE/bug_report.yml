name: Bug Report
description: Create a report to help us reproduce and fix a bug or unexpected behavior.
title: "[BUG]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in Cadence Clinical. Please provide detailed information to help reproduce and fix the bug.

  - type: dropdown
    id: domain
    attributes:
      label: Functional Domain
      description: Select the system domain affected by this bug.
      options:
        - "Core Platform & Execution Engine"
        - "API Gateway, Security & Identity"
        - "Clinical Data Interoperability & Standards"
        - "Clinical Operations & Business Modules"
        - "Compliance, Audit & Governance"
        - "Frontend & Design System"
        - "DevOps, Tooling & CI/CD"
    validations:
      required: true

  - type: input
    id: requirement_id
    attributes:
      label: Traced Requirement ID (if known)
      description: Requirement identifier affected by this bug (e.g. PRD-SYS-001, Trace-1).
      placeholder: "e.g. PRD-SYS-001"
    validations:
      required: false

  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: Description of what you expected to happen.
    validations:
      required: true
